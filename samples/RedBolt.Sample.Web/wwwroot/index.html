<!DOCTYPE html>
<html lang="en">
<head>
  <title>RedBolt samples</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly">
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11151c;
      color: #edf2f7;
    }
    body { margin: 0; }
    main { min-height: 100vh; display: grid; place-items: center; }
    section { width: min(32rem, calc(100vw - 3rem)); }
    select, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.8rem;
      font: inherit;
    }
    button { cursor: pointer; }
    #runner { display: none; width: 100vw; height: 100vh; }
    #runner.active { display: block; }
    #runner header {
      position: fixed;
      z-index: 1;
      padding: 0.6rem 0.8rem;
      background: rgb(17 21 28 / 80%);
    }
    #runner a { color: #9dc8ff; }
    #canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <main>
    <section id="selector">
      <h1>RedBolt samples</h1>
      <p>Choose a sample to load in WebAssembly.</p>
      <select id="sample" aria-label="Sample"></select>
      <button id="load" type="button">Load sample</button>
    </section>
    <section id="runner">
      <header>
        <a href="./">All samples</a>
        <span id="result" data-status="loading">Loading…</span>
      </header>
      <canvas id="canvas" tabindex="0"></canvas>
    </section>
  </main>
</body>
</html>
