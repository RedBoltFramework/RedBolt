<!DOCTYPE html>
<html lang="en">
<head>
  <title>RedBolt samples</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly">
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11151c;
      color: #edf2f7;
    }
    html, body { margin: 0; padding: 0; overflow: hidden; }
    main { min-height: 100vh; display: grid; place-items: center; }
    section { width: min(32rem, calc(100vw - 3rem)); }
    select, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.8rem;
      font: inherit;
    }
    button { cursor: pointer; }
    #runner { display: none; width: 100vw; height: 100vh; }
    #runner.active { display: block; }
    #runner header {
      position: fixed;
      z-index: 1;
      padding: 0.6rem 0.8rem;
      background: rgb(17 21 28 / 80%);
    }
    #runner a { color: #9dc8ff; }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      border: none;
      cursor: default !important;
    }
    #loading {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      background: #11151c;
    }
    #loading[hidden] { display: none; }
    #progress { margin-top: 0.5rem; }
    #fullscreen-button {
      position: fixed;
      z-index: 2;
      width: 2rem;
      height: 2rem;
      left: 50%;
      top: 4px;
      transform: translateX(-50%);
      padding: 0;
      margin: 0;
      stroke: #999;
      stroke-width: 10px;
      background: transparent;
      border: 0;
    }
    #fullscreen-button:hover { fill: #999; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section id="selector">
      <h1>RedBolt samples</h1>
      <p>Choose a sample to load in WebAssembly.</p>
      <select id="sample" aria-label="Sample"></select>
      <button id="load" type="button">Load sample</button>
    </section>
    <section id="runner">
      <header>
        <a href="./">All samples</a>
        <span id="result" data-status="loading">Loading…</span>
      </header>
      <canvas id="canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="status">Downloading...</div>
        <progress hidden id="progress" max="100" value="10"></progress>
      </div>
      <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen" hidden>
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M93.1,139.6l46.5-46.5L93.1,46.5L139.6,0H0v139.6l46.5-46.5L93.1,139.6z M93.1,372.4l-46.5,46.5L0,372.4V512h139.6l-46.5-46.5l46.5-46.5L93.1,372.4z M372.4,139.6H139.6v232.7h232.7V139.6z M325.8,325.8H186.2V186.2h139.6V325.8z M372.4,0l46.5,46.5l-46.5,46.5l46.5,46.5l46.5-46.5l46.5,46.5V0H372.4z M418.9,372.4l-46.5,46.5l46.5,46.5L372.4,512H512V372.4l-46.5,46.5L418.9,372.4z"/>
        </svg>
      </button>
    </section>
  </main>
</body>
</html>
